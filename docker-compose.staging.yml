version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: kgs-staging-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kgs_staging_secure_pass_2026}
      POSTGRES_DB: ${POSTGRES_DB:-kaizentrix_staging}
    ports:
      - "5432:5432"
    volumes:
      - kgs_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-kaizentrix_staging}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kgs-staging-net

  redis:
    image: redis:7-alpine
    container_name: kgs-staging-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - kgs_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kgs-staging-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kgs-staging-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENV=staging
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-kgs_staging_secure_pass_2026}@postgres:5432/${POSTGRES_DB:-kaizentrix_staging}
      - REDIS_URL=redis://redis:6379/0
      - SECRET_KEY=${SECRET_KEY:-kgs_staging_jwt_secret_key_67394821_f4e1}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - LIVEKIT_URL=${LIVEKIT_URL:-wss://livekit.staging.kaizentrix.com}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID:-rzp_test_mock_12345}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET:-mock_secret_key_razorpay}
      - CORS_ORIGINS=["http://localhost:3000","http://127.0.0.1:3000","http://web:3000","https://staging.kaizentrix.com"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/live"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kgs-staging-net

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    container_name: kgs-staging-web
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_TELEMETRY_DISABLED=1
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - kgs-staging-net

volumes:
  kgs_postgres_data:
    driver: local
  kgs_redis_data:
    driver: local

networks:
  kgs-staging-net:
    driver: bridge

